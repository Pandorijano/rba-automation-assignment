name: RBA Selenium Tests daily run

on:
  push:
    branches: [ main ]
  schedule:
    # Every workday at 06:00 in the morning
    - cron: 0 6 * * 1-5

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests (ExchangeCalculatorTest only)
        run: mvn -B -Dtest=ExchangeCalculatorTest test