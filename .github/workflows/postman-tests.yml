name: Postman API Tests (Newman)

on:
  push:
    branches: [ main ]
  schedule:
    # Postman tests every workday at 06:00 in the morning
    - cron: 0 6 * * 1-5

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection with Newman
        run: |
          newman run postman/rba-postman-collection.json \
            --environment postman/rba-prod-env.json \
            --reporters cli
